services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: modupdater
      POSTGRES_PASSWORD: modupdater
      POSTGRES_DB: modupdater
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modupdater"]
      interval: 5s
      timeout: 5s
      retries: 5

# Future app service volumes (uncomment when app service is added):
# - ./data/repos:/app/data/repos
# - ./data/keys:/app/data/keys

volumes:
  postgres_data:
