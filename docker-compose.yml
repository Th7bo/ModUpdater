services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: modupdater
      POSTGRES_PASSWORD: modupdater
      POSTGRES_DB: modupdater
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modupdater"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
      - app_repos:/app/data/repos
      - app_keys:/app/data/keys
      - app_logs:/app/data/logs
      - app_artifacts:/app/data/artifacts
      - gradle_cache:/root/.gradle
    env_file:
      - .env.local
    environment:
      - DATABASE_URL=postgresql://modupdater:modupdater@db:5432/modupdater
      - AUTH_URL=http://localhost:3000
      - REPOS_DIR=/app/data/repos
      - SSH_KEYS_DIR=/app/data/keys
      - LOG_DIR=/app/data/logs
      - ARTIFACTS_DIR=/app/data/artifacts
      - BASE_URL=http://localhost:3000
      - GRADLE_USER_HOME=/root/.gradle
      - GRADLE_OPTS=-Dorg.gradle.daemon=true -Dorg.gradle.parallel=true -Dorg.gradle.caching=true
    depends_on:
      db:
        condition: service_healthy
    stdin_open: true
    tty: true

volumes:
  postgres_data:
  app_node_modules:
  app_repos:
  app_keys:
  app_logs:
  app_artifacts:
  gradle_cache:
