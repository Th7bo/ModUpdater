services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: modupdater
      POSTGRES_PASSWORD: modupdater
      POSTGRES_DB: modupdater
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modupdater"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      # Override DATABASE_URL to use the docker network service name
      DATABASE_URL: postgres://modupdater:modupdater@db:5432/modupdater
    ports:
      - "3000:3000"
    volumes:
      - ./data/keys:/app/data/keys
      - ./data/logs:/app/data/logs
    restart: unless-stopped

volumes:
  postgres_data:
